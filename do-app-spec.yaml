# DigitalOcean App Platform Specification
#
# DEPLOYMENT CHECKLIST — complete steps in order:
#
#   [ ] 1. Install doctl CLI:
#          https://docs.digitalocean.com/reference/doctl/how-to/install/
#
#   [ ] 2. Authenticate doctl:
#          doctl auth init
#
#   [ ] 3. Create a Container Registry (one-time):
#          doctl registry create <your-org> --subscription-tier starter
#
#   [ ] 4. Create a Managed PostgreSQL database:
#          DO Console → Databases → Create → PostgreSQL
#          (note the connection string for DATABASE_URL below)
#
#   [ ] 5. Create a Managed Redis database:
#          DO Console → Databases → Create → Redis
#          (note the connection string for REDIS_URL below)
#
#   [ ] 6. Set GitHub Secrets (repo → Settings → Secrets → Actions):
#          - DIGITALOCEAN_ACCESS_TOKEN  → from https://cloud.digitalocean.com/account/api/tokens
#          - DO_REGISTRY_NAME           → your registry name from step 3 (e.g. "your-org")
#          - DO_APP_ID                  → leave blank for now; fill in after step 8
#          - REACT_APP_API_URL          → your public domain (e.g. "https://app.example.com")
#          - DATABASE_URL               → managed PostgreSQL connection string from step 4
#
#   [ ] 7. Replace every "your-org" and "your-domain.com" in this file with real values.
#          Search for: your-org   your-domain.com
#
#   [ ] 8. First deploy (creates the app):
#          doctl apps create --spec do-app-spec.yaml
#
#   [ ] 9. Get the App ID and save it as the DO_APP_ID GitHub Secret:
#          doctl apps list
#
#   [ ] 10. Seed the database (one-time):
#           psql "$DATABASE_URL" -f database/seed-scenarios.sql
#
#   [ ] 11. Create your facilitator account:
#           curl -X POST https://your-domain.com/api/auth/register \
#             -H 'Content-Type: application/json' \
#             -d '{"username":"admin","password":"yourpassword","role":"facilitator"}'
#
#   After initial setup, every push to main triggers automatic deployment via CI/CD.
#   Update with: doctl apps update <APP_ID> --spec do-app-spec.yaml

name: scenario-planning
region: nyc  # Change to your preferred region: nyc, sfo, ams, sgp, lon, fra, tor, blr, syd

services:
  - name: backend
    image:
      registry_type: DOCR
      registry: your-org               # <-- your DOCR registry name
      repository: backend
      tag: latest                       # CI overrides this with git SHA
    http_port: 5000
    instance_count: 1
    instance_size_slug: basic-xs        # 1 vCPU, 1 GB RAM (~$12/mo)
    routes:
      - path: /api
      - path: /socket.io
    health_check:
      http_path: /api/health
      initial_delay_seconds: 10
      period_seconds: 30
      timeout_seconds: 5
      failure_threshold: 3
    envs:
      - key: NODE_ENV
        value: "production"
      - key: PORT
        value: "5000"
      - key: FRONTEND_URL
        value: "https://your-domain.com"  # <-- your public domain
      - key: JWT_SECRET
        value: ""                          # <-- set via: doctl apps update (encrypted)
        type: SECRET
      - key: DATABASE_URL
        value: ""                          # <-- from DO managed PostgreSQL connection string
        type: SECRET
      - key: REDIS_URL
        value: ""                          # <-- from DO managed Redis connection string
        type: SECRET

  - name: frontend
    image:
      registry_type: DOCR
      registry: your-org               # <-- your DOCR registry name
      repository: frontend
      tag: latest                       # CI overrides this with git SHA
    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-xxs       # 1 vCPU, 512 MB RAM (~$5/mo)
    routes:
      - path: /                         # catch-all — must be defined after more specific routes
    health_check:
      http_path: /
      initial_delay_seconds: 10
      period_seconds: 30
      timeout_seconds: 5
      failure_threshold: 3

# Optional: custom domain
# domains:
#   - domain: your-domain.com
#     type: PRIMARY
#   - domain: www.your-domain.com
#     type: ALIAS
